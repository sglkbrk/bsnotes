services:
  backend:
    container_name: bsnotes-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5002}:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network

  frontend:
    container_name: bsnotes-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-https://bsnote.buraksaglik.com/api/}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3002"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    external: true
